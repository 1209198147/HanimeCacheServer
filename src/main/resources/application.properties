spring.application.name=Hannime

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:hannime.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=

# MyBatis-Plus Configuration
#mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.id-type=input
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml

# Logging Configuration
logging.config=classpath:logback-spring.xml
logging.level.com.shikou.hannime=DEBUG

# 地区
hannime.zone=HK
# 语言（zhs为简体中文，zht为繁体中文）
hannime.lang=zhs

# 是否开启缓存任务（开启后任务才会被执行，定期缓存视频）
video.task.enable=false

# 缓存配置
cache.enabled=true
# 缓存有效期
cache.duration=1
# 缓存时间单位
cache.unit=MINUTES
# 缓存最大数量
cache.maxSize=1000
# 缓存任务
cache.task.enable=true


# 禁用静态资源自动映射，无匹配处理器时抛出NoHandlerFoundException（Spring Boot 4.0+ 默认行为）
spring.web.resources.add-mappings=false
server.servlet.context-path=/

# Tomcat 资源缓存限制（防止超长URL导致OOM）
server.tomcat.resource.cache-ttl=5000
server.tomcat.resource.cache-max-size=10240

# 视频下载路径
video.store.path=/downloads/videos/
# 可选（480P/720P/1080P等 lowest则是最低画质，highest则是最高画质）
video.quality=lowest